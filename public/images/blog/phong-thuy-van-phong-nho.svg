<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#1c0e12"/>
  <!-- Cua so lon phia sau -->
  <rect x="60" y="60" width="220" height="200" rx="4" fill="#26141a" stroke="#3d1f27" stroke-width="2"/>
  <line x1="60" y1="160" x2="280" y2="160" stroke="#3d1f27" stroke-width="1.5"/>
  <line x1="170" y1="60" x2="170" y2="260" stroke="#3d1f27" stroke-width="1.5"/>
  <!-- Cay xanh canh cua so -->
  <path d="M120 260 v-55" stroke="#8f6f37" stroke-width="3" fill="none"/>
  <g fill="#c9a256" opacity="0.9">
    <ellipse cx="120" cy="195" rx="26" ry="14"/>
    <ellipse cx="100" cy="210" rx="20" ry="11"/>
    <ellipse cx="142" cy="210" rx="20" ry="11"/>
  </g>
  <!-- Ban lam viec -->
  <rect x="330" y="290" width="330" height="14" fill="#3d1f27" stroke="#c9a256" stroke-width="1.5"/>
  <g stroke="#8a725a" stroke-width="6">
    <line x1="345" y1="304" x2="345" y2="380"/>
    <line x1="645" y1="304" x2="645" y2="380"/>
  </g>
  <!-- Ghế lung tua vach -->
  <rect x="470" y="330" width="60" height="14" rx="4" fill="#26141a" stroke="#dcbd7a" stroke-width="1.5"/>
  <rect x="480" y="270" width="40" height="60" rx="6" fill="#26141a" stroke="#dcbd7a" stroke-width="1.5"/>
  <!-- Laptop -->
  <g fill="none" stroke="#dcbd7a" stroke-width="1.5">
    <rect x="440" y="255" width="55" height="35" rx="2"/>
    <rect x="437" y="290" width="61" height="6" rx="2"/>
  </g>
  <!-- Chồng tài liệu và đèn bàn -->
  <rect x="360" y="270" width="40" height="20" fill="#26141a" stroke="#c2a988" stroke-width="1.2"/>
  <rect x="360" y="260" width="40" height="10" fill="#26141a" stroke="#c2a988" stroke-width="1.2"/>
  <line x1="600" y1="290" x2="600" y2="240" stroke="#c9a256" stroke-width="2"/>
  <path d="M580 240 h40 l-8 -22 h-24 z" fill="none" stroke="#c9a256" stroke-width="1.5"/>
  <!-- Vách ngăn thấp bên phải thay tường -->
  <rect x="700" y="180" width="14" height="160" fill="#26141a" stroke="#3d1f27" stroke-width="2"/>
</svg>

<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#1c0e12"/>
  <!-- Mat tien cua hang -->
  <rect x="150" y="130" width="500" height="270" fill="#26141a" stroke="#6b3b46" stroke-width="2.5"/>
  <!-- Mai hien -->
  <polygon points="120,130 680,130 650,80 150,80" fill="#3d1f27" stroke="#c9a256" stroke-width="2"/>
  <g stroke="#8f6f37" stroke-width="1.5">
    <line x1="180" y1="130" x2="165" y2="80"/>
    <line x1="290" y1="130" x2="280" y2="80"/>
    <line x1="400" y1="130" x2="400" y2="80"/>
    <line x1="510" y1="130" x2="520" y2="80"/>
    <line x1="620" y1="130" x2="635" y2="80"/>
  </g>
  <!-- Bien hieu -->
  <rect x="300" y="55" width="200" height="34" rx="4" fill="#150a0c" stroke="#dcbd7a" stroke-width="2"/>
  <text x="400" y="78" fill="#dcbd7a" font-family="serif" font-size="16" text-anchor="middle" letter-spacing="3">SHOP</text>
  <!-- Cua kinh trung bay 2 ben -->
  <rect x="175" y="160" width="130" height="150" fill="#150a0c" stroke="#c9a256" stroke-width="1.5" opacity="0.85"/>
  <rect x="495" y="160" width="130" height="150" fill="#150a0c" stroke="#c9a256" stroke-width="1.5" opacity="0.85"/>
  <circle cx="240" cy="235" r="18" fill="none" stroke="#c9a256" stroke-width="1.2"/>
  <rect x="530" y="215" width="60" height="40" fill="none" stroke="#c9a256" stroke-width="1.2"/>
  <!-- Cua chinh giua, mo -->
  <rect x="355" y="180" width="90" height="220" fill="#150a0c" stroke="#dcbd7a" stroke-width="2.5"/>
  <line x1="400" y1="180" x2="400" y2="400" stroke="#6b3b46" stroke-width="1"/>
  <!-- Quay thu ngan ben trong, thay qua o cua -->
  <rect x="370" y="330" width="60" height="35" fill="#26141a" stroke="#c9a256" stroke-width="1.5"/>
  <!-- Nguoi/dong khach tuong trung bang cham tron -->
  <g fill="#dcbd7a" opacity="0.9">
    <circle cx="400" cy="430" r="7"/>
  </g>
  <g fill="#8a725a" opacity="0.6">
    <circle cx="340" cy="425" r="6"/>
    <circle cx="460" cy="425" r="6"/>
  </g>
</svg>

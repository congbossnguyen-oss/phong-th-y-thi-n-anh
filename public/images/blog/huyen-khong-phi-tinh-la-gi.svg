<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#1c0e12"/>
  <text x="400" y="50" fill="#c2a988" font-family="serif" font-size="16" text-anchor="middle" letter-spacing="2">TINH BÀN CỬU CUNG</text>
  <!-- Luoi 3x3 -->
  <g transform="translate(250,80)">
    <rect x="0" y="0" width="300" height="300" fill="none" stroke="#6b3b46" stroke-width="2"/>
    <line x1="100" y1="0" x2="100" y2="300" stroke="#3d1f27" stroke-width="1.5"/>
    <line x1="200" y1="0" x2="200" y2="300" stroke="#3d1f27" stroke-width="1.5"/>
    <line x1="0" y1="100" x2="300" y2="100" stroke="#3d1f27" stroke-width="1.5"/>
    <line x1="0" y1="200" x2="300" y2="200" stroke="#3d1f27" stroke-width="1.5"/>
    <!-- Lo Thu magic square 4-9-2 / 3-5-7 / 8-1-6 -->
    <g fill="#dcbd7a" font-family="serif" font-size="34" text-anchor="middle">
      <text x="50" y="65">4</text>
      <text x="150" y="65">9</text>
      <text x="250" y="65">2</text>
      <text x="50" y="165">3</text>
      <text x="150" y="165">5</text>
      <text x="250" y="165">7</text>
      <text x="50" y="265">8</text>
      <text x="150" y="265">1</text>
      <text x="250" y="265">6</text>
    </g>
    <!-- O trung tam noi bat -->
    <rect x="100" y="100" width="100" height="100" fill="none" stroke="#c14a3a" stroke-width="2.5"/>
    <g fill="#c2a988" font-family="serif" font-size="11" text-anchor="middle" opacity="0.85">
      <text x="50" y="30">ĐN</text>
      <text x="150" y="30">NAM</text>
      <text x="250" y="30">TN</text>
      <text x="15" y="165">ĐÔNG</text>
      <text x="285" y="165">TÂY</text>
      <text x="50" y="290">ĐB</text>
      <text x="150" y="290">BẮC</text>
      <text x="250" y="290">TB</text>
    </g>
  </g>
  <text x="400" y="415" fill="#a68b6c" font-family="serif" font-size="13" text-anchor="middle">Sơ đồ Lạc Thư — nền tảng của tinh bàn Huyền Không</text>
</svg>

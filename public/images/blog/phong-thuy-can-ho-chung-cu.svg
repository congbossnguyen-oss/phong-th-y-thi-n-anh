<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#1c0e12"/>
  <!-- Toa nha chinh -->
  <rect x="250" y="40" width="220" height="400" fill="#26141a" stroke="#6b3b46" stroke-width="2"/>
  <!-- Toa nha phu hai ben, thap hon -->
  <rect x="120" y="140" width="110" height="300" fill="#1c0e12" stroke="#3d1f27" stroke-width="2"/>
  <rect x="490" y="180" width="110" height="260" fill="#1c0e12" stroke="#3d1f27" stroke-width="2"/>
  <!-- Luoi cua so toa nha chinh -->
  <g fill="none" stroke="#8f6f37" stroke-width="1">
    <line x1="250" y1="90" x2="470" y2="90"/>
    <line x1="250" y1="140" x2="470" y2="140"/>
    <line x1="250" y1="190" x2="470" y2="190"/>
    <line x1="250" y1="240" x2="470" y2="240"/>
    <line x1="250" y1="290" x2="470" y2="290"/>
    <line x1="250" y1="340" x2="470" y2="340"/>
    <line x1="290" y1="40" x2="290" y2="440"/>
    <line x1="330" y1="40" x2="330" y2="440"/>
    <line x1="390" y1="40" x2="390" y2="440"/>
    <line x1="430" y1="40" x2="430" y2="440"/>
  </g>
  <!-- O sang duoc chieu sang, khong deu de tao chieu sau -->
  <g fill="#dcbd7a" opacity="0.85">
    <rect x="295" y="95" width="30" height="35"/>
    <rect x="395" y="95" width="30" height="35"/>
    <rect x="335" y="145" width="50" height="35" fill="#c9a256"/>
    <rect x="295" y="245" width="30" height="35"/>
    <rect x="435" y="195" width="30" height="35"/>
    <rect x="255" y="295" width="30" height="35"/>
    <rect x="395" y="345" width="30" height="35"/>
  </g>
  <g fill="#26141a" opacity="0.6">
    <rect x="335" y="95" width="50" height="35"/>
    <rect x="295" y="145" width="30" height="35"/>
    <rect x="435" y="145" width="30" height="35"/>
    <rect x="335" y="245" width="50" height="35"/>
    <rect x="335" y="295" width="50" height="35"/>
  </g>
  <!-- Cua chinh -->
  <rect x="380" y="395" width="40" height="45" fill="#150a0c" stroke="#dcbd7a" stroke-width="2"/>
</svg>
